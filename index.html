<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="渋滞ヒートマップ">
<meta name="format-detection" content="telephone=no">
<title>高速道路 渋滞ヒートマップ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #263548;
    --accent: #38bdf8;
    --accent2: #0ea5e9;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --green: #22c55e;
    --lime: #84cc16;
    --yellow: #facc15;
    --orange: #f97316;
    --red: #ef4444;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    touch-action: manipulation;
  }
  body {
    min-height: 100vh;
    padding-bottom: calc(40px + var(--safe-bottom));
    padding-left: var(--safe-left);
    padding-right: var(--safe-right);
  }
  /* Disable text selection on UI chrome (allow on inputs / heatmap labels) */
  .header, .steps, .card-title, .btn-primary, .btn-back, .suggestion,
  .quick-date, .selected-badge, .recommend, .alert, .legend {
    -webkit-user-select: none; user-select: none;
  }

  .header {
    background: linear-gradient(180deg, #1e3a5f 0%, var(--bg) 100%);
    padding: calc(20px + var(--safe-top)) 20px 20px;
    text-align: center;
  }
  .header h1 { font-size: 21px; font-weight: 700; }
  .header p { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .steps { display: flex; justify-content: center; gap: 6px; padding: 0 20px 16px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all .3s; }
  .step-dot.active { background: var(--accent); width: 24px; border-radius: 4px; }
  .step-dot.done { background: var(--accent2); }

  .container { max-width: 430px; margin: 0 auto; padding: 0 14px; }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
  .card-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 14px 16px 8px; }
  .card-body { padding: 0 16px 16px; }

  .btn-back { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 14px; background: none; border: none; cursor: pointer; padding: 0 0 12px; }
  .btn-primary { width: 100%; padding: 15px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0f172a; font-size: 16px; font-weight: 700; border: none; cursor: pointer; transition: opacity .2s, transform .1s; }
  .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Autocomplete */
  .search-wrap { padding: 14px 16px; }
  .search-input {
    width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; color: var(--text); font-size: 16px; outline: none;
    -webkit-appearance: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .suggestions { max-height: 360px; overflow-y: auto; border-top: 1px solid var(--border); }
  .suggestion {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background .15s; display: flex; align-items: center; justify-content: space-between;
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:hover, .suggestion.active { background: var(--card2); }
  .suggestion .ic-name { font-size: 15px; }
  .suggestion .ic-name mark { background: rgba(56,189,248,.3); color: var(--accent); padding: 0 2px; border-radius: 2px; }
  .suggestion .ic-hw { font-size: 11px; color: var(--muted); }
  .suggestion.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .empty-msg { padding: 20px 16px; color: var(--muted); font-size: 13px; text-align: center; }

  /* Selected IC badge */
  .selected-badge {
    background: rgba(56,189,248,.12); border: 1px solid rgba(56,189,248,.3); border-radius: 10px;
    padding: 10px 12px; margin: 0 16px 12px; font-size: 13px; color: var(--accent);
    display: flex; justify-content: space-between; align-items: center;
  }
  .selected-badge .clear { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 0 4px; }

  /* Date selection */
  .date-wrap { padding: 14px 16px; }
  .dt-input {
    background: var(--card2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; color: var(--text); font-size: 16px; width: 100%; outline: none;
    -webkit-appearance: none;
  }
  .dt-input:focus { border-color: var(--accent); }
  .quick-dates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 16px 16px; }
  .quick-date {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 4px; cursor: pointer; text-align: center; transition: all .15s;
  }
  .quick-date.active { background: rgba(56,189,248,.15); border-color: var(--accent); }
  .quick-date .qd-name { font-size: 10px; color: var(--muted); }
  .quick-date .qd-date { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .quick-date .qd-tag { font-size: 9px; color: var(--orange); margin-top: 2px; min-height: 11px; }
  .date-info { padding: 0 16px 14px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .date-info .badge { display: inline-block; background: var(--card2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; font-size: 11px; margin-right: 4px; margin-bottom: 4px; }
  .date-info .badge.warn { background: rgba(249,115,22,.12); border-color: rgba(249,115,22,.4); color: var(--orange); }
  .date-info .badge.holiday { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); color: var(--red); }

  /* Result screen */
  .summary {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 12px;
  }
  .summary .route-line { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  .summary .route-line .ic { font-weight: 600; }
  .summary .route-line .arrow { color: var(--muted); }
  .summary .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .heatmap-wrap { padding: 14px 8px 8px; overflow-x: hidden; }
  .heatmap-canvas { display: block; max-width: 100%; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 4px 16px 14px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .slider-wrap { padding: 8px 16px 16px; }
  .slider-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .slider-label .lbl { font-size: 12px; color: var(--muted); }
  .slider-label .val { font-size: 22px; font-weight: 600; color: var(--accent); letter-spacing: -0.5px; }
  input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none; height: 4px;
    border-radius: 2px; background: var(--border); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 4px rgba(56,189,248,.2);
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: none;
    box-shadow: 0 0 0 4px rgba(56,189,248,.2);
  }

  .recommend {
    background: linear-gradient(135deg, rgba(34,197,94,.15), rgba(56,189,248,.15));
    border: 1px solid rgba(34,197,94,.4); border-radius: 12px;
    padding: 12px 14px; margin: 0 16px 14px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; transition: all .15s;
  }
  .recommend:active { transform: scale(0.99); }
  .recommend .star { font-size: 22px; }
  .recommend .info { flex: 1; }
  .recommend .info .ttl { font-size: 13px; color: var(--text); font-weight: 600; }
  .recommend .info .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .recommend .arrow { color: var(--accent); font-size: 18px; }

  .alerts { padding: 0 16px 14px; }
  .alert {
    padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
    margin-bottom: 6px; display: flex; gap: 8px; align-items: flex-start;
  }
  .alert.danger { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); }
  .alert.warn { background: rgba(249,115,22,.1); border: 1px solid rgba(249,115,22,.3); }
  .alert.ok { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); }
  .alert .ic { font-size: 16px; }

  .disclaimer { font-size: 10px; color: var(--muted); text-align: center; padding: 10px 16px 0; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">
  <h1>🛣️ 高速道路 渋滞ヒートマップ</h1>
  <p>ルート × 時間で混雑を一望</p>
</div>

<div class="steps" id="stepDots"></div>

<div class="container">

  <!-- SCREEN 1: Entry IC -->
  <div class="screen active" id="screenEntry">
    <div class="card">
      <div class="card-title">入口IC（乗るIC）</div>
      <div class="search-wrap">
        <input type="text" class="search-input" id="entrySearch" placeholder="例：三郷、東京、八王子…" autocomplete="off">
      </div>
      <div class="suggestions" id="entrySuggestions"></div>
    </div>
  </div>

  <!-- SCREEN 2: Exit IC -->
  <div class="screen" id="screenExit">
    <button class="btn-back" onclick="goToScreen('Entry')">‹ 入口ICを変更</button>
    <div class="selected-badge" id="entryBadge"></div>
    <div class="card">
      <div class="card-title">出口IC（降りるIC）</div>
      <div class="search-wrap">
        <input type="text" class="search-input" id="exitSearch" placeholder="例：水戸、御殿場…" autocomplete="off">
      </div>
      <div class="suggestions" id="exitSuggestions"></div>
    </div>
  </div>

  <!-- SCREEN 3: Date -->
  <div class="screen" id="screenDate">
    <button class="btn-back" onclick="goToScreen('Exit')">‹ 出口ICを変更</button>
    <div class="selected-badge" id="routeBadge"></div>
    <div class="card">
      <div class="card-title">出発日</div>
      <div class="date-wrap">
        <input type="date" id="deptDate" class="dt-input">
      </div>
      <div class="quick-dates" id="quickDates"></div>
      <div class="date-info" id="dateInfo"></div>
    </div>
    <button class="btn-primary" onclick="showResult()">ヒートマップを見る ›</button>
  </div>

  <!-- SCREEN 4: Result (Heatmap) -->
  <div class="screen" id="screenResult">
    <button class="btn-back" onclick="goToScreen('Date')">‹ 条件を変更</button>

    <div class="summary" id="resultSummary"></div>

    <div class="card">
      <div class="card-title">混雑ヒートマップ（縦：IC × 横：時間）</div>
      <div class="heatmap-wrap">
        <canvas id="heatmap" class="heatmap-canvas"></canvas>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>快適</div>
        <div class="legend-item"><div class="legend-dot" style="background:#84cc16"></div>やや混む</div>
        <div class="legend-item"><div class="legend-dot" style="background:#facc15"></div>混雑</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>渋滞</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>激渋滞</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fff;border-radius:50%"></div>出発時刻トレース</div>
      </div>

      <div class="slider-wrap">
        <div class="slider-label">
          <span class="lbl">出発時刻（白い線が斜めに走る）</span>
          <span class="val" id="deptHourDisplay">08:00</span>
        </div>
        <input type="range" id="deptHourSlider" min="0" max="23" value="8">
      </div>

      <div class="recommend" id="recommendBox"></div>
      <div class="alerts" id="alertsBox"></div>
    </div>

    <p class="disclaimer">
      ※ 本予測は過去の傾向・統計に基づく参考情報です。<br>
      実際の交通状況とは異なる場合があります。
    </p>
  </div>

</div>

/* ====================================================================
 * GRAPH BUILD: フラットIC配列 + 隣接マップ (BFS用)
 * ================================================================== */
const IC_NODES = []; // { id, name, highwayId, highwayName, profile, idx }
const IC_GRAPH = new Map(); // id -> [{ neighborId, distance }]
const IC_BY_ID = new Map();

HIGHWAYS.forEach(hw => {
  hw.ics.forEach((ic, i) => {
    const id = `${hw.id}:${i}`;
    const node = { id, name: ic.name, highwayId: hw.id, highwayName: hw.name, profile: ic.profile, idx: i };
    IC_NODES.push(node);
    IC_BY_ID.set(id, node);
    IC_GRAPH.set(id, []);
  });
  for (let i = 0; i < hw.ics.length - 1; i++) {
    const a = `${hw.id}:${i}`;
    const b = `${hw.id}:${i+1}`;
    const d = hw.ics[i].distanceToNext;
    IC_GRAPH.get(a).push({ neighborId: b, distance: d });
    IC_GRAPH.get(b).push({ neighborId: a, distance: d });
  }
});

/* BFS: from→to の最短経路を [{node, distToNext}] で返す。到達不能ならnull */
function bfsRoute(fromId, toId) {
  if (fromId === toId) return null;
  const prev = new Map(); // id -> { from, dist }
  prev.set(fromId, { from: null, dist: 0 });
  const q = [fromId];
  while (q.length) {
    const cur = q.shift();
    if (cur === toId) break;
    for (const { neighborId, distance } of IC_GRAPH.get(cur)) {
      if (!prev.has(neighborId)) {
        prev.set(neighborId, { from: cur, dist: distance });
        q.push(neighborId);
      }
    }
  }
  if (!prev.has(toId)) return null;
  const path = [];
  let cur = toId;
  while (cur !== null) {
    path.unshift(cur);
    cur = prev.get(cur).from;
  }
  return path.map((id, i) => {
    const node = IC_BY_ID.get(id);
    const distToNext = i < path.length - 1 ? prev.get(path[i+1]).dist : 0;
    return { ...node, distToNext };
  });
}

/* fromIdから到達可能なIC IDセット (BFS) */
function reachableFrom(fromId) {
  const visited = new Set([fromId]);
  const q = [fromId];
  while (q.length) {
    const cur = q.shift();
    for (const { neighborId } of IC_GRAPH.get(cur)) {
      if (!visited.has(neighborId)) { visited.add(neighborId); q.push(neighborId); }
    }
  }
  visited.delete(fromId);
  return visited;
}

/* ====================================================================

 * ================================================================== */
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function getDateFactors(date) {
  const dow = date.getDay();
  const dom = date.getDate();
  const month = date.getMonth() + 1;
  const lastDay = new Date(date.getFullYear(), month, 0).getDate();
  const tomorrow = new Date(date); tomorrow.setDate(date.getDate() + 1);

  const factors = [];
  let mult = 1.0;

  if ([5,10,15,20,25].includes(dom) || dom === lastDay) { mult *= 1.2; factors.push({ key: 'gotoubi', label: '5・10日（ごとおび）', warn: true }); }
  if (dow === 5) { mult *= 1.15; factors.push({ key: 'fri', label: '金曜', warn: true }); }
  if (dow === 1) { mult *= 1.05; factors.push({ key: 'mon', label: '月曜' }); }
  if (dow === 0) { mult *= 1.10; factors.push({ key: 'sun', label: '日曜' }); }
  if (dow === 6) { mult *= 1.10; factors.push({ key: 'sat', label: '土曜' }); }
  if (HOLIDAYS.has(dateKey(date))) { mult *= 1.20; factors.push({ key: 'hol', label: '祝日', holiday: true }); }
  if (HOLIDAYS.has(dateKey(tomorrow))) { mult *= 1.25; factors.push({ key: 'preHol', label: '祝日前日', warn: true }); }
  if ((month === 4 && dom >= 29) || (month === 5 && dom <= 6)) { mult *= 1.6; factors.push({ key: 'gw', label: 'GW期間', warn: true }); }
  if (month === 8 && dom >= 10 && dom <= 18) { mult *= 1.5; factors.push({ key: 'obon', label: 'お盆期間', warn: true }); }
  if ((month === 12 && dom >= 28) || (month === 1 && dom <= 3)) { mult *= 1.5; factors.push({ key: 'nyear', label: '年末年始', warn: true }); }

  return { mult, factors };
}

function getCongestion(date, hour, profileName, dateMult) {
  const p = PROFILES[profileName];
  const base = p.hourMult[Math.floor(hour) % 24];
  return Math.min(5, base * dateMult);
}

function scoreToColor(s) {
  if (s < 1.0) return '#22c55e';
  if (s < 1.8) return '#84cc16';
  if (s < 2.5) return '#facc15';
  if (s < 3.5) return '#f97316';
  return '#ef4444';
}

function scoreToLabel(s) {
  if (s < 1.0) return '快適';
  if (s < 1.8) return 'やや混む';
  if (s < 2.5) return '混雑';
  if (s < 3.5) return '渋滞';
  return '激渋滞';
}

/* ====================================================================
 * AUTOCOMPLETE
 * ================================================================== */
function normalizeQuery(q) {
  return q.trim()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .toLowerCase();
}

function matchIC(node, q) {
  if (!q) return true;
  const name = node.name.toLowerCase();
  const hw = node.highwayName.toLowerCase();
  return name.includes(q) || hw.includes(q);
}

function highlightMatch(text, q) {
  if (!q) return text;
  const lower = text.toLowerCase();
  const idx = lower.indexOf(q);
  if (idx < 0) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
}

function renderSuggestions(containerId, query, candidateNodes, onSelect, disabledSet) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const q = normalizeQuery(query);
  const matched = candidateNodes.filter(n => matchIC(n, q)).slice(0, 30);
  if (matched.length === 0) {
    container.innerHTML = '<div class="empty-msg">該当するICが見つかりません</div>';
    return;
  }
  matched.forEach(node => {
    const div = document.createElement('div');
    const disabled = disabledSet && disabledSet.has(node.id);
    div.className = 'suggestion' + (disabled ? ' disabled' : '');
    div.innerHTML =
      `<div class="ic-name">${highlightMatch(node.name, q)}</div>` +
      `<div class="ic-hw">${node.highwayName}</div>`;
    if (!disabled) div.onclick = () => onSelect(node);
    container.appendChild(div);
  });
}

function totalDistance(route) {
  return route.reduce((s, n) => s + n.distToNext, 0);
}

function renderQuickDates() {
  const container = document.getElementById('quickDates');
  container.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  const selected = state.date ? dateKey(state.date) : '';
  for (let i = 0; i < 8; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const key = dateKey(d);
    const dow = d.getDay();
    const factors = getDateFactors(d).factors;
    const tag = factors.find(f => f.warn || f.holiday);
    const div = document.createElement('div');
    div.className = 'quick-date' + (key === selected ? ' active' : '');
    div.innerHTML =
      `<div class="qd-name" style="${dow===0?'color:#ef4444':dow===6?'color:#38bdf8':''}">${DOW_NAMES[dow]}</div>` +
      `<div class="qd-date">${d.getDate()}</div>` +
      `<div class="qd-tag">${tag ? (tag.holiday ? '祝' : tag.label.slice(0,2)) : ''}</div>`;
    div.onclick = () => {
      state.date = new Date(d);
      document.getElementById('deptDate').value = key;
      renderQuickDates();
      renderDateInfo();
    };
    container.appendChild(div);
  }
}

function renderDateInfo() {
  const info = document.getElementById('dateInfo');
  if (!state.date) { info.innerHTML = ''; return; }
  const { factors, mult } = getDateFactors(state.date);
  const dow = state.date.getDay();
  const dateLabel = state.date.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
  let html = `<div style="margin-bottom:6px;color:var(--text);font-size:13px">${dateLabel}</div>`;
  if (factors.length === 0) {
    html += `<span class="badge">特定日該当なし（混雑要因 +0%）</span>`;
  } else {
    factors.forEach(f => {
      const cls = f.holiday ? 'badge holiday' : f.warn ? 'badge warn' : 'badge';
      html += `<span class="${cls}">${f.label}</span>`;
    });
    html += `<div style="margin-top:6px">日付要因による混雑乗数: <strong style="color:var(--accent)">×${mult.toFixed(2)}</strong></div>`;
  }
  info.innerHTML = html;
}

  if (!window._heatmapResize) {
    window._heatmapResize = true;
    window.addEventListener('resize', () => { if (state.currentScreen === 'Result') renderHeatmap(); });
  }
}

function updateDeptHourDisplay() {
  document.getElementById('deptHourDisplay').textContent =
    String(state.deptHour).padStart(2,'0') + ':00';
}

/* ====================================================================
 * HEATMAP RENDERING
 * ================================================================== */
function renderHeatmap() {
  const route = state.route;
  const date = state.date;
  if (!route || !date) return;

  const { mult: dateMult } = getDateFactors(date);
  const canvas = document.getElementById('heatmap');
  const wrap = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;

  const cssWidth = Math.min(wrap.clientWidth - 4, 420);
  const labelWidth = 78;
  const hourLabelHeight = 22;
  const cellHeight = 30;
  const heatWidth = cssWidth - labelWidth - 4;
  const cellWidth = heatWidth / 24;
  const cssHeight = hourLabelHeight + cellHeight * route.length + 6;

  canvas.style.width = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  // Hour labels (top)
  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let h = 0; h < 24; h += 3) {
    const x = labelWidth + h * cellWidth + cellWidth / 2;
    ctx.fillText(String(h).padStart(2,'0'), x, hourLabelHeight / 2);
  }
  // Right edge label
  ctx.fillText('24', labelWidth + 24 * cellWidth, hourLabelHeight / 2);

  // Cells
  route.forEach((node, i) => {
    const y = hourLabelHeight + i * cellHeight;
    // IC label
    ctx.fillStyle = i === 0 || i === route.length - 1 ? '#f1f5f9' : '#cbd5e1';
    ctx.font = (i === 0 || i === route.length - 1 ? 'bold ' : '') + '11px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const nameShort = node.name.length > 7 ? node.name.slice(0, 6) + '…' : node.name;
    ctx.fillText(nameShort, labelWidth - 6, y + cellHeight / 2);

    // Heat cells
    for (let h = 0; h < 24; h++) {
      const score = getCongestion(date, h, node.profile, dateMult);
      ctx.fillStyle = scoreToColor(score);
      ctx.fillRect(labelWidth + h * cellWidth + 0.5, y + 1, cellWidth - 1, cellHeight - 2);
    }
  });

  // Diagonal trace
  drawDiagonalTrace(ctx, route, state.deptHour, date, dateMult, labelWidth, hourLabelHeight, cellWidth, cellHeight);

  // Update alerts
  renderAlerts();
}

/* 出発時刻からの斜め線トレース */
function tracePoints(route, deptHour) {
  let cumDist = 0;
  return route.map((node, i) => {
    const travelHours = cumDist / BASE_SPEED_KMH;
    const arrivalHourFloat = deptHour + travelHours;
    const dayOffset = Math.floor(arrivalHourFloat / 24);
    const hourInDay = arrivalHourFloat - dayOffset * 24;
    if (i < route.length - 1) cumDist += node.distToNext;
    return { i, node, hourInDay, arrivalHourFloat, dayOffset };
  });
}

function drawDiagonalTrace(ctx, route, deptHour, date, dateMult, labelWidth, hourLabelHeight, cellWidth, cellHeight) {
  const points = tracePoints(route, deptHour);
  const xOf = h => labelWidth + h * cellWidth;
  const yOf = i => hourLabelHeight + i * cellHeight + cellHeight / 2;
  const rightEdge = labelWidth + 24 * cellWidth;
  const leftEdge = labelWidth;

  // Line shadow
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  drawTraceLine(ctx, points, xOf, yOf, rightEdge, leftEdge);
  ctx.restore();

  // Line
  ctx.save();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  drawTraceLine(ctx, points, xOf, yOf, rightEdge, leftEdge);
  ctx.restore();

  // Markers
  points.forEach(p => {
    const x = xOf(p.hourInDay);
    const y = yOf(p.i);
    ctx.save();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function drawTraceLine(ctx, points, xOf, yOf, rightEdge, leftEdge) {
  ctx.beginPath();
  ctx.moveTo(xOf(points[0].hourInDay), yOf(points[0].i));
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1];
    const b = points[i];
    if (a.dayOffset === b.dayOffset) {
      ctx.lineTo(xOf(b.hourInDay), yOf(b.i));
    } else {
      // Cross midnight: split
      const aHourGlobal = a.arrivalHourFloat;
      const bHourGlobal = b.arrivalHourFloat;
      const boundary = (a.dayOffset + 1) * 24;
      const frac = (boundary - aHourGlobal) / (bHourGlobal - aHourGlobal);
      const ay = yOf(a.i);
      const by = yOf(b.i);
      const splitY = ay + (by - ay) * frac;
      ctx.lineTo(rightEdge, splitY);
      ctx.moveTo(leftEdge, splitY);
      ctx.lineTo(xOf(b.hourInDay), yOf(b.i));
    }
  }
  ctx.stroke();
}

/* ====================================================================
 * RECOMMEND & ALERTS
 * ================================================================== */
function calcRouteScore(route, deptHour, date, dateMult) {
  const points = tracePoints(route, deptHour);
  let total = 0;
  let maxScore = 0;
  let worst = null;
  points.forEach(p => {
    const s = getCongestion(date, p.hourInDay, p.node.profile, dateMult);
    total += s;
    if (s > maxScore) { maxScore = s; worst = { node: p.node, hour: p.hourInDay, score: s }; }
  });
  return { total, maxScore, worst };
}

function renderRecommend() {
  const { mult: dateMult } = getDateFactors(state.date);
  let best = { hour: 0, score: Infinity };
  for (let h = 0; h < 24; h++) {
    const { total } = calcRouteScore(state.route, h, state.date, dateMult);
    if (total < best.score) best = { hour: h, score: total };
  }

  const box = document.getElementById('recommendBox');
  box.innerHTML =
    `<div class="star">✨</div>` +
    `<div class="info">` +
      `<div class="ttl">おすすめ出発時刻: ${String(best.hour).padStart(2,'0')}:00</div>` +
      `<div class="sub">合計スコア最小（タップで適用）</div>` +
    `</div>` +
    `<div class="arrow">›</div>`;
  box.onclick = () => {
    state.deptHour = best.hour;
    document.getElementById('deptHourSlider').value = best.hour;
    updateDeptHourDisplay();
    renderHeatmap();
  };
}

function renderAlerts() {
  const { mult: dateMult } = getDateFactors(state.date);
  const points = tracePoints(state.route, state.deptHour);
  const box = document.getElementById('alertsBox');
  box.innerHTML = '';

  const danger = []; // score >= 3.5
  const warn = [];   // 2.5 <= score < 3.5
  let maxScore = 0;
  points.forEach(p => {
    const s = getCongestion(state.date, p.hourInDay, p.node.profile, dateMult);
    const hourStr = String(Math.floor(p.hourInDay)).padStart(2,'0');
    if (s >= 3.5) danger.push({ p, s, hourStr });
    else if (s >= 2.5) warn.push({ p, s, hourStr });
    if (s > maxScore) maxScore = s;
  });

  if (danger.length > 0) {
    danger.forEach(({ p, s, hourStr }) => {
      const a = document.createElement('div');
      a.className = 'alert danger';
      a.innerHTML = `<span class="ic">⚠</span><span><strong>${hourStr}時頃 ${p.node.name}</strong> で激渋滞の可能性 (スコア ${s.toFixed(1)})</span>`;
      box.appendChild(a);
    });
  }
  if (warn.length > 0) {
    warn.forEach(({ p, s, hourStr }) => {
      const a = document.createElement('div');
      a.className = 'alert warn';
      a.innerHTML = `<span class="ic">●</span><span>${hourStr}時頃 ${p.node.name} で渋滞 (スコア ${s.toFixed(1)})</span>`;
      box.appendChild(a);
    });
  }
  if (danger.length === 0 && warn.length === 0) {
    const a = document.createElement('div');
    a.className = 'alert ok';
    a.innerHTML = `<span class="ic">✓</span><span>このルート・出発時刻なら大きな渋滞は予想されません</span>`;
    box.appendChild(a);
  }
}

/* ====================================================================
 * INIT
 * ================================================================== */
(function init() {
  updateStepDots();
  initEntryScreen();
})();

/* ====================================================================
 * CAPACITOR NATIVE BRIDGES (no-op when running in plain web)
 * ================================================================== */
(function initNative() {
  const Cap = window.Capacitor;
  if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform()) return;

  // Status bar styling
  const SB = Cap.Plugins && Cap.Plugins.StatusBar;
  if (SB) {
    SB.setStyle && SB.setStyle({ style: 'DARK' }).catch(() => {});
    SB.setBackgroundColor && SB.setBackgroundColor({ color: '#0f172a' }).catch(() => {});
    SB.setOverlaysWebView && SB.setOverlaysWebView({ overlay: false }).catch(() => {});
  }

  // Android hardware back button → previous screen instead of exit
  const App = Cap.Plugins && Cap.Plugins.App;
  if (App && App.addListener) {
    App.addListener('backButton', () => {
      const order = ['Entry', 'Exit', 'Date', 'Result'];
      const idx = order.indexOf(state.currentScreen);
      if (idx > 0) goToScreen(order[idx - 1]);
      else App.exitApp && App.exitApp();
    });
  }
})();
</script>
