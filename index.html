<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>高速道路 渋滞予測</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #263548;
    --accent: #38bdf8;
    --accent2: #0ea5e9;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --green: #22c55e;
    --yellow: #facc15;
    --orange: #f97316;
    --red: #ef4444;
    --radius: 16px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding-bottom: 40px; }

  .header {
    background: linear-gradient(180deg, #1e3a5f 0%, var(--bg) 100%);
    padding: 52px 20px 24px;
    text-align: center;
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; color: var(--text); }
  .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .steps { display: flex; justify-content: center; gap: 6px; padding: 0 20px 20px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all .3s; }
  .step-dot.active { background: var(--accent); width: 24px; border-radius: 4px; }
  .step-dot.done { background: var(--accent2); }

  .container { max-width: 430px; margin: 0 auto; padding: 0 16px; }

  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }

  .select-list { list-style: none; }
  .select-list li { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .15s; font-size: 16px; }
  .select-list li:last-child { border-bottom: none; }
  .select-list li:hover { background: var(--card2); }
  .select-list li .chevron { color: var(--muted); font-size: 14px; }

  .ic-grid { display: flex; flex-direction: column; gap: 0; }
  .ic-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .15s; }
  .ic-item:last-child { border-bottom: none; }
  .ic-item:hover { background: var(--card2); }
  .ic-item.selected { background: rgba(56,189,248,.12); }
  .ic-item.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .ic-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--muted); background: transparent; }
  .ic-item.selected .ic-dot { background: var(--accent); border-color: var(--accent); }
  .ic-name { font-size: 15px; flex: 1; }
  .ic-dist { font-size: 12px; color: var(--muted); }

  .datetime-row { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .dt-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .dt-input { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 16px; width: 100%; outline: none; -webkit-appearance: none; }
  .dt-input:focus { border-color: var(--accent); }

  .hour-slider-wrap { padding: 0 16px 16px; }
  .hour-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .hour-display { font-size: 36px; font-weight: 300; color: var(--accent); letter-spacing: -1px; text-align: center; margin-bottom: 8px; }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(56,189,248,.2); }

  .btn-primary { width: 100%; padding: 16px; border-radius: var(--radius); background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0f172a; font-size: 17px; font-weight: 700; border: none; cursor: pointer; letter-spacing: 0.01em; transition: opacity .2s, transform .1s; margin-bottom: 14px; }
  .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-back { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 15px; background: none; border: none; cursor: pointer; padding: 0 0 16px; }

  .summary-banner { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .summary-banner .tag { background: rgba(56,189,248,.15); border: 1px solid rgba(56,189,248,.3); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--accent); }

  .ic-pass-list { display: flex; flex-direction: column; gap: 0; }
  .ic-pass-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); position: relative; }
  .ic-pass-item:last-child { border-bottom: none; }
  .ic-pass-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; }
  .ic-pass-info { flex: 1; }
  .ic-pass-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .ic-pass-time { font-size: 12px; color: var(--muted); }
  .ic-pass-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; text-align: right; }
  .ic-pass-label { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; max-width: 120px; }

  .chart-wrap { padding: 16px; position: relative; }
  .chart-wrap canvas { width: 100% !important; }

  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px 16px 16px; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--card2); border-radius: 10px; padding: 8px 4px; cursor: pointer; transition: background .15s; }
  .week-day.today { border: 1px solid var(--accent); }
  .week-day:hover { background: #2d3f56; }
  .week-day .wd-name { font-size: 10px; color: var(--muted); }
  .week-day .wd-date { font-size: 14px; font-weight: 600; }
  .week-day .wd-emoji { font-size: 16px; }

  .cond-list { list-style: none; }
  .cond-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
  .cond-item:last-child { border-bottom: none; }
  .cond-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

  .alert { padding: 14px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .alert.info { background: rgba(56,189,248,.1); border: 1px solid rgba(56,189,248,.25); }
  .alert.warn { background: rgba(249,115,22,.1); border: 1px solid rgba(249,115,22,.25); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 16px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .search-input-wrap { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .search-input { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 16px; width: 100%; outline: none; -webkit-appearance: none; }
  .search-input:focus { border-color: var(--accent); }
  .ic-suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; max-height: 60vh; overflow-y: auto; }
  .ic-suggestion { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; cursor: pointer; transition: background .15s, border-color .15s; min-width: 0; }
  .ic-suggestion:hover, .ic-suggestion:active { background: rgba(56,189,248,.15); border-color: var(--accent); }
  .ic-suggestion-name { font-size: 15px; font-weight: 500; }
  .ic-suggestion-hw { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .no-result { padding: 20px; text-align: center; color: var(--muted); font-size: 14px; width: 100%; }

  .screen { display: none; }
  .screen.active { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .screen.active { animation: fadeIn .3s ease; }

  .disclaimer { font-size: 11px; color: var(--muted); text-align: center; padding: 8px 16px 0; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">
  <h1>🛣️ 高速道路 渋滞予測</h1>
  <p>出発前に混雑傾向をチェック</p>
</div>

<div class="steps" id="stepDots"></div>

<div class="container">

  <!-- SCREEN 1: Entry IC search -->
  <div class="screen active" id="screen1">
    <div class="card">
      <div class="card-title">乗るIC（入口）を入力</div>
      <div class="search-input-wrap">
        <input type="text" id="entrySearch" class="search-input" placeholder="IC名を入力（例: 三郷、東京、御殿場）" autocomplete="off">
      </div>
      <div class="ic-suggestions" id="entrySuggestions"></div>
    </div>
  </div>

  <!-- SCREEN 2: Exit IC search -->
  <div class="screen" id="screen2">
    <button class="btn-back" onclick="goToScreen(1)">‹ 入口IC選択に戻る</button>
    <div class="summary-banner" id="screen2Banner"></div>
    <div class="card">
      <div class="card-title">降りるIC（出口）を入力</div>
      <div class="search-input-wrap">
        <input type="text" id="exitSearch" class="search-input" placeholder="降りるICを検索…" autocomplete="off">
      </div>
      <div class="ic-suggestions" id="exitSuggestions"></div>
    </div>
  </div>

  <!-- SCREEN 3: Date & Time -->
  <div class="screen" id="screen3">
    <button class="btn-back" onclick="goToScreen(2)">‹ 出口IC選択に戻る</button>
    <div class="card">
      <div class="card-title">出発日・出発時刻を選ぶ</div>
      <div class="datetime-row">
        <div>
          <div class="dt-label">出発日</div>
          <input type="date" id="deptDate" class="dt-input">
        </div>
      </div>
      <div class="hour-slider-wrap">
        <div class="hour-label">出発時刻（〇時台）</div>
        <div class="hour-display" id="hourDisplay">08:00</div>
        <input type="range" id="hourSlider" min="0" max="23" value="8" oninput="updateHourDisplay()">
      </div>
    </div>
    <button class="btn-primary" onclick="showResult()">予測を見る ›</button>
  </div>

  <!-- SCREEN 4: Result -->
  <div class="screen" id="screen4">
    <button class="btn-back" onclick="goToScreen(3)">‹ 条件を変更する</button>

    <div class="summary-banner" id="summaryBanner"></div>
    <div id="overallAlert"></div>

    <div class="card">
      <div class="card-title">IC通過 時間帯の混雑予測</div>
      <div class="ic-pass-list" id="icPassList"></div>
    </div>

    <div class="card">
      <div class="card-title">時間帯別 混雑スコア</div>
      <div class="chart-wrap">
        <canvas id="congestionChart" height="200"></canvas>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>空いている</div>
        <div class="legend-item"><div class="legend-dot" style="background:#facc15"></div>やや空き</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>普通〜やや混雑</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>混雑</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">週間 混雑傾向カレンダー</div>
      <div class="week-grid" id="weekCalendar"></div>
      <p class="disclaimer">同時刻帯・同路線の混雑傾向を表示しています</p><br>
    </div>

    <div class="card">
      <div class="card-title">混雑しやすい条件</div>
      <ul class="cond-list" id="condList"></ul>
    </div>

    <p class="disclaimer" style="padding-bottom:16px">
      ※ 本予測は過去の傾向・統計に基づく参考情報です。<br>
      実際の交通状況とは異なる場合があります。
    </p>
  </div>

</div>

<script>
const HIGHWAYS = [
  { id: 'joban', name: '常磐道 (E6)',
    ics: [
      { name: '水戸IC', distanceToNext: 30 },
      { name: '土浦北IC', distanceToNext: 5 },
      { name: '土浦IC', distanceToNext: 40 },
      { name: '柏IC', distanceToNext: 10 },
      { name: '流山IC', distanceToNext: 10 },
      { name: '三郷JCT', distanceToNext: 0 }
    ],
    segmentMultipliers: { '柏IC→流山IC': 1.3, '流山IC→三郷JCT': 1.3 }
  },
  { id: 'tomei', name: '東名 (E1)',
    ics: [
      { name: '御殿場IC', distanceToNext: 40 },
      { name: '厚木IC', distanceToNext: 20 },
      { name: '横浜IC', distanceToNext: 20 },
      { name: '東京IC', distanceToNext: 10 },
      { name: '用賀IC', distanceToNext: 0 }
    ],
    segmentMultipliers: { '横浜IC→東京IC': 1.4, '東京IC→用賀IC': 1.4 }
  },
  { id: 'shinotomei', name: '新東名 (E1A)',
    ics: [
      { name: '浜松いなさJCT', distanceToNext: 50 },
      { name: '岡崎東IC', distanceToNext: 15 },
      { name: '豊田東JCT', distanceToNext: 80 },
      { name: '新清水JCT', distanceToNext: 20 },
      { name: '新富士IC', distanceToNext: 20 },
      { name: '御殿場JCT', distanceToNext: 0 }
    ],
    segmentMultipliers: {}
  },
  { id: 'chuo', name: '中央道 (E20)',
    ics: [
      { name: '甲府IC', distanceToNext: 35 },
      { name: '大月IC', distanceToNext: 40 },
      { name: '八王子IC', distanceToNext: 25 },
      { name: '調布IC', distanceToNext: 8 },
      { name: '高井戸IC', distanceToNext: 0 }
    ],
    segmentMultipliers: { '八王子IC→調布IC': 1.2, '調布IC→高井戸IC': 1.2 }
  },
  { id: 'kanetsu', name: '関越道 (E17)',
    ics: [
      { name: '湯沢IC', distanceToNext: 80 },
      { name: '本庄児玉IC', distanceToNext: 30 },
      { name: '鶴ヶ島JCT', distanceToNext: 10 },
      { name: '所沢IC', distanceToNext: 15 },
      { name: '練馬IC', distanceToNext: 0 }
    ],
    segmentMultipliers: {}
  }
];

const HOLIDAYS = new Set([
  '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20',
  '2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06',
  '2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23',
  '2026-10-12','2026-11-03','2026-11-23','2026-12-23'
]);

const DOW_NAMES = ['日','月','火','水','木','金','土'];

let state = { highway: null, entryIdx: null, exitIdx: null, date: null, hour: 8, currentScreen: 1 };
let chartInstance = null;

function getCongestionScore(date, hour, multiplier = 1.0) {
  let s = 0;
  const dow = date.getDay(), dom = date.getDate(), month = date.getMonth() + 1;
  const lastDay = new Date(date.getFullYear(), month, 0).getDate();
  const key = d => d.toISOString().slice(0, 10);
  const isHol = d => HOLIDAYS.has(key(d));
  const addD = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };

  if ([5,10,15,20,25].includes(dom) || dom === lastDay) s += 1.5;
  if (dow === 5) s += 1.2;
  if (dow === 1) s += 0.6;
  if (dow === 0 || dow === 6) s += 0.4;
  if (isHol(date)) s += 0.8;
  if (isHol(addD(date, 1))) s += 1.5;
  if ((month === 4 && dom >= 29) || (month === 5 && dom <= 6)) s += 2.5;
  if (month === 8 && dom >= 10 && dom <= 18) s += 2.0;
  if ((month === 12 && dom >= 28) || (month === 1 && dom <= 3)) s += 2.0;
  if (hour >= 0 && hour <= 4) s -= 2.5;
  else if (hour >= 7 && hour <= 9) s += 2.2;
  else if (hour >= 17 && hour <= 20) s += 2.5;
  else if (hour >= 13 && hour <= 16) s += 0.5;
  else if (hour >= 21) s -= 0.5;
  if (dow === 1 && hour >= 7 && hour <= 10) s += 0.8;
  if (dow === 5 && hour >= 17 && hour <= 20) s += 0.8;

  return Math.max(0, Math.min(5, s * multiplier));
}

function scoreToInfo(score) {
  if (score < 1.0) return { emoji: '🟢', label: '空いている',   desc: '快適に通過できる可能性が高い',           color: '#22c55e', bg: 'rgba(34,197,94,.15)' };
  if (score < 2.0) return { emoji: '🟡', label: 'やや空き',     desc: '比較的スムーズな可能性が高い',           color: '#facc15', bg: 'rgba(250,204,21,.15)' };
  if (score < 3.0) return { emoji: '🟠', label: '普通',         desc: '多少の混雑が見られる傾向があります',     color: '#f97316', bg: 'rgba(249,115,22,.15)' };
  if (score < 4.0) return { emoji: '🟠', label: 'やや混雑',     desc: '混雑しやすい傾向があります',             color: '#f97316', bg: 'rgba(249,115,22,.2)' };
  return             { emoji: '🔴', label: '混雑',          desc: '渋滞が発生しやすい時間帯です',           color: '#ef4444', bg: 'rgba(239,68,68,.15)' };
}

function goToScreen(n) {
  document.querySelectorAll('.screen').forEach((s, i) => s.classList.toggle('active', i + 1 === n));
  state.currentScreen = n;
  updateStepDots();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateStepDots() {
  const dots = document.getElementById('stepDots');
  dots.innerHTML = '';
  for (let i = 1; i <= 4; i++) {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i === state.currentScreen ? ' active' : i < state.currentScreen ? ' done' : '');
    dots.appendChild(d);
  }
}

const ALL_ICS_FLAT = [];
HIGHWAYS.forEach(hw => {
  hw.ics.forEach((ic, idx) => {
    ALL_ICS_FLAT.push({ name: ic.name, highway: hw, idx });
  });
});

function renderSuggestions(containerId, items, onSelect) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  if (items.length === 0) {
    container.innerHTML = '<div class="no-result">該当するICが見つかりません</div>';
    return;
  }
  items.forEach(ic => {
    const div = document.createElement('div');
    div.className = 'ic-suggestion';
    div.innerHTML = `<div class="ic-suggestion-name">${ic.name}</div><div class="ic-suggestion-hw">${ic.highway.name}</div>`;
    div.onclick = () => onSelect(ic);
    container.appendChild(div);
  });
}

function filterEntryICs(query) {
  const q = (query || '').trim().toLowerCase();
  return ALL_ICS_FLAT.filter(ic => {
    if (ic.idx === ic.highway.ics.length - 1) return false;
    if (!q) return true;
    return ic.name.toLowerCase().includes(q) || ic.highway.name.toLowerCase().includes(q);
  });
}

function filterExitICs(query) {
  const q = (query || '').trim().toLowerCase();
  return ALL_ICS_FLAT.filter(ic => {
    if (ic.highway !== state.highway) return false;
    if (ic.idx <= state.entryIdx) return false;
    if (!q) return true;
    return ic.name.toLowerCase().includes(q);
  });
}

function initEntrySearch() {
  const input = document.getElementById('entrySearch');
  const update = () => {
    renderSuggestions('entrySuggestions', filterEntryICs(input.value), ic => {
      state.highway = ic.highway;
      state.entryIdx = ic.idx;
      state.exitIdx = null;
      initExitSearch();
      goToScreen(2);
    });
  };
  input.addEventListener('input', update);
  update();
}

function initExitSearch() {
  const input = document.getElementById('exitSearch');
  input.value = '';
  document.getElementById('screen2Banner').innerHTML =
    `<span class="tag">${state.highway.name}</span><span class="tag">入口: ${state.highway.ics[state.entryIdx].name}</span>`;
  const update = () => {
    renderSuggestions('exitSuggestions', filterExitICs(input.value), ic => {
      state.exitIdx = ic.idx;
      goToScreen(3);
    });
  };
  input.oninput = update;
  update();
}

function initDateScreen() {
  const dateInput = document.getElementById('deptDate');
  const today = new Date();
  const fmt = d => d.toISOString().slice(0, 10);
  dateInput.min = fmt(today);
  const maxDate = new Date(today); maxDate.setDate(today.getDate() + 90);
  dateInput.max = fmt(maxDate);
  if (!state.date) { dateInput.value = fmt(today); state.date = today; }
  else dateInput.value = fmt(state.date);
  dateInput.addEventListener('change', e => { state.date = new Date(e.target.value + 'T00:00:00'); });
  document.getElementById('hourSlider').value = state.hour;
  updateHourDisplay();
}

function updateHourDisplay() {
  const h = parseInt(document.getElementById('hourSlider').value);
  state.hour = h;
  document.getElementById('hourDisplay').textContent = String(h).padStart(2,'0') + ':00';
}

function calcPassingTimes(highway, entryIdx, exitIdx, deptHour) {
  let mins = 0;
  const result = [];
  for (let i = entryIdx; i <= exitIdx; i++) {
    const hour = (deptHour + Math.floor(mins / 60)) % 24;
    result.push({ ic: highway.ics[i].name, hour });
    if (i < exitIdx) mins += (highway.ics[i].distanceToNext / 100) * 60;
  }
  return result;
}

function getSegmentMultiplier(highway, fromIcName, toIcName) {
  return highway.segmentMultipliers[fromIcName + '→' + toIcName] || 1.0;
}

function showResult() {
  const hw = state.highway;
  const dateStr = document.getElementById('deptDate').value;
  state.date = new Date(dateStr + 'T00:00:00');
  state.hour = parseInt(document.getElementById('hourSlider').value);

  const entryName = hw.ics[state.entryIdx].name;
  const exitName  = hw.ics[state.exitIdx].name;
  const dateLabel = state.date.toLocaleDateString('ja-JP', { month:'long', day:'numeric', weekday:'short' });

  document.getElementById('summaryBanner').innerHTML =
    `<span class="tag">${hw.name}</span><span class="tag">${entryName} → ${exitName}</span><span class="tag">${dateLabel} ${String(state.hour).padStart(2,'0')}:00 出発</span>`;

  const passings = calcPassingTimes(hw, state.entryIdx, state.exitIdx, state.hour);
  const scores = passings.map((p, idx) => {
    const mult = idx > 0 ? getSegmentMultiplier(hw, passings[idx-1].ic, p.ic) : 1.0;
    return getCongestionScore(state.date, p.hour, mult);
  });

  const maxScore = Math.max(...scores);
  const overallInfo = scoreToInfo(maxScore);
  document.getElementById('overallAlert').innerHTML =
    `<div class="alert ${maxScore >= 3.5 ? 'warn' : 'info'}">
      <span style="font-size:20px">${overallInfo.emoji}</span>
      <div><strong>${overallInfo.label}</strong><br>
      <span style="color:var(--muted);font-size:13px">この時間帯は${overallInfo.desc}</span></div>
    </div>`;

  const icList = document.getElementById('icPassList');
  icList.innerHTML = '';
  passings.forEach((p, idx) => {
    const sc = scores[idx];
    const info = scoreToInfo(sc);
    const div = document.createElement('div');
    div.className = 'ic-pass-item';
    div.innerHTML =
      `<div class="ic-pass-dot" style="background:${info.color}"></div>
       <div class="ic-pass-info">
         <div class="ic-pass-name">${p.ic}</div>
         <div class="ic-pass-time">通過予測: ${String(p.hour).padStart(2,'0')}時台</div>
       </div>
       <div style="text-align:right">
         <div class="ic-pass-badge" style="background:${info.bg};color:${info.color}">${info.emoji} ${info.label}</div>
         <div class="ic-pass-label">${info.desc}</div>
       </div>`;
    icList.appendChild(div);
  });

  renderChart(passings, scores);
  renderWeekCalendar();
  renderConditions();
  goToScreen(4);
}

function renderChart(passings, icScores) {
  const hours = Array.from({length: 24}, (_, i) => i);
  const date = state.date;
  const avgMult = icScores.length > 1
    ? icScores.slice(1).reduce((a, _, i) => a + getSegmentMultiplier(state.highway, passings[i].ic, passings[i+1].ic), 0) / (icScores.length - 1)
    : 1.0;

  const chartData = hours.map(h => getCongestionScore(date, h, avgMult));
  const barColors = chartData.map(s =>
    s < 1.0 ? 'rgba(34,197,94,0.75)' :
    s < 2.0 ? 'rgba(250,204,21,0.75)' :
    s < 3.5 ? 'rgba(249,115,22,0.75)' :
              'rgba(239,68,68,0.8)'
  );

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const ctx = document.getElementById('congestionChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: hours.map(h => String(h).padStart(2,'0') + '時'),
      datasets: [{ label: '混雑スコア', data: chartData, backgroundColor: barColors, borderRadius: 4, borderSkipped: false }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: ctx => { const info = scoreToInfo(ctx.parsed.y); return ' ' + info.emoji + ' ' + info.label + ' (' + ctx.parsed.y.toFixed(1) + ')'; } },
          backgroundColor: '#1e293b', borderColor: '#334155', borderWidth: 1,
          titleColor: '#94a3b8', bodyColor: '#f1f5f9'
        }
      },
      scales: {
        x: { grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#64748b', font: { size: 9 }, maxTicksLimit: 12, callback: (val, idx) => idx % 3 === 0 ? String(idx).padStart(2,'0') : '' } },
        y: { min: 0, max: 5, grid: { color: 'rgba(51,65,85,0.5)' }, ticks: { color: '#64748b', font: { size: 10 }, stepSize: 1 } }
      }
    },
    plugins: [{
      id: 'icMarkers',
      afterDraw(chart) {
        const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
        passings.forEach((p, idx) => {
          const xPos = x.getPixelForValue(p.hour);
          ctx.save();
          ctx.strokeStyle = 'rgba(56,189,248,0.85)';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 3]);
          ctx.beginPath(); ctx.moveTo(xPos, top); ctx.lineTo(xPos, bottom); ctx.stroke();
          ctx.restore();
          ctx.save();
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(p.ic.replace(/(IC|JCT)$/, ''), xPos, top - 4);
          ctx.restore();
        });
      }
    }]
  });
}

function renderWeekCalendar() {
  const container = document.getElementById('weekCalendar');
  container.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const sc = getCongestionScore(d, state.hour, 1.0);
    const info = scoreToInfo(sc);
    const div = document.createElement('div');
    div.className = 'week-day' + (i === 0 ? ' today' : '');
    div.innerHTML =
      `<div class="wd-name">${DOW_NAMES[d.getDay()]}</div>
       <div class="wd-date" style="color:${i===0?'var(--accent)':''}">${d.getDate()}</div>
       <div class="wd-emoji">${info.emoji}</div>`;
    div.onclick = () => {
      state.date = new Date(d);
      document.getElementById('deptDate').value = d.toISOString().slice(0,10);
      showResult();
    };
    container.appendChild(div);
  }
}

function renderConditions() {
  const ul = document.getElementById('condList');
  ul.innerHTML = '';
  const conditions = [
    { icon: '🎌', text: '祝日前日の夕方以降は混雑が発生しやすい傾向があります' },
    { icon: '🌸', text: 'GW（4月末〜5月上旬）は特に上下線とも渋滞しやすい時期です' },
    { icon: '🌊', text: 'お盆期間（8月10〜18日頃）は帰省ラッシュで混雑しやすくなります' },
    { icon: '🎍', text: '年末年始（12月28日〜1月3日）は長距離移動が集中しやすい傾向があります' },
    { icon: '🌅', text: '早朝（0〜4時台）は交通量が少なく、快適に通過できる可能性が高い時間帯です' },
    { icon: '🌆', text: '夕方ラッシュ（17〜20時台）は都市部への流入が増え、混雑が発生しやすい傾向があります' },
    { icon: '📅', text: '月曜朝（7〜10時台）は週明けの通勤・業務車両が集中しやすい傾向があります' },
    { icon: '💳', text: '5・10日（ごとおび）や月末は物流車両が増える傾向があります' },
  ];
  conditions.forEach(c => {
    const li = document.createElement('li');
    li.className = 'cond-item';
    li.innerHTML = `<span class="cond-icon">${c.icon}</span><span>${c.text}</span>`;
    ul.appendChild(li);
  });
}

(function init() {
  updateStepDots();
  initEntrySearch();
  initDateScreen();
})();
</script>
